# Two services that talk to each other, for the client to test against, on the host's ports:
#   service1     localhost:8085  the shop (orders, products), debugger port localhost:5005
#   service2     localhost:8086  the kitchen (tickets, menu), debugger port localhost:5006
# The two services' ports are in .env (SERVICE1_PORT, SERVICE2_PORT): each service listens on it inside its container,
# it's published on the host, and the other service calls it there. Change them there, or for one run:
#   SERVICE1_PORT=9085 docker compose up -d
#   service1-db  localhost:2345  (teo / kaima, database testdb, schema shop)
#   service2-db  localhost:2346  (teo / kaima, database testdb2, schema kitchen)
#   kafka        localhost:9092  (topics orders.events and kitchen.events, created by the services)
# More stores, seeded on a fresh start (stores/), for the client's DB configs of other types:
#   loyalty-db   localhost:3307  MySQL    (teo / kaima, database loyalty: customers, points)
#   warehouse-db localhost:3308  MariaDB  (teo / kaima, database warehouse: stock, deliveries)
#   docs-db      localhost:27017 MongoDB  (teo / kaima, authSource admin, database shopdocs: reviews, audit)
#   cache        localhost:6379  Redis    (password kaima: stock:*, product:* hashes, orders:recent, tags:*)
services:
  service1-db:
    image: postgres:alpine
    container_name: service1-db
    environment:
      POSTGRES_USER: teo
      POSTGRES_PASSWORD: kaima
      POSTGRES_DB: testdb
    ports:
      - "2345:5432"
    volumes:
      - ./service1/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "teo", "-d", "testdb"]
      interval: 2s
      retries: 30

  service2-db:
    image: postgres:alpine
    container_name: service2-db
    environment:
      POSTGRES_USER: teo
      POSTGRES_PASSWORD: kaima
      POSTGRES_DB: testdb2
    ports:
      - "2346:5432"
    volumes:
      - ./service2/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "teo", "-d", "testdb2"]
      interval: 2s
      retries: 30

  # Single node in KRaft mode (no zookeeper). Two listeners: localhost:9092 for the host (the client,
  # your IDE) and kafka:29092 for the containers here.
  kafka:
    image: apache/kafka:3.9.0
    container_name: test-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 30

  # The services call each other by name, so neither waits for the other; a call to one that isn't up yet is a 502
  service1:
    build: ./service1
    container_name: service1
    ports:
      - "${SERVICE1_PORT:-8085}:${SERVICE1_PORT:-8085}"
      - "5005:5005"
    environment:
      DB_URL: jdbc:postgresql://service1-db:5432/testdb
      KAFKA_BOOTSTRAP: kafka:29092
      PORT: ${SERVICE1_PORT:-8085}
      KITCHEN_URL: http://service2:${SERVICE2_PORT:-8086}
      # Background calls to service2 (GET /menu, every 20 s); false: none
      CHATTER_ENABLED: ${CHATTER_ENABLED:-true}
      # Lets a debugger (debugview, the IDE's Remote JVM Debug) attach on 5005; suspend=n starts it without waiting
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      service1-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  service2:
    build: ./service2
    container_name: service2
    ports:
      - "${SERVICE2_PORT:-8086}:${SERVICE2_PORT:-8086}"
      - "5006:5005"
    environment:
      DB_URL: jdbc:postgresql://service2-db:5432/testdb2
      KAFKA_BOOTSTRAP: kafka:29092
      PORT: ${SERVICE2_PORT:-8086}
      SHOP_URL: http://service1:${SERVICE1_PORT:-8085}
      # Background calls to service1 (GET /products every 15 s, a staff meal POST /orders every 45 s); false: none
      CHATTER_ENABLED: ${CHATTER_ENABLED:-true}
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      service2-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  loyalty-db:
    image: mysql:8.4
    container_name: loyalty-db
    environment:
      MYSQL_ROOT_PASSWORD: kaima
      MYSQL_DATABASE: loyalty
      MYSQL_USER: teo
      MYSQL_PASSWORD: kaima
    ports:
      - "3307:3306"
    volumes:
      - ./stores/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uteo", "-pkaima"]
      interval: 3s
      retries: 40

  warehouse-db:
    image: mariadb:11
    container_name: warehouse-db
    environment:
      MARIADB_ROOT_PASSWORD: kaima
      MARIADB_DATABASE: warehouse
      MARIADB_USER: teo
      MARIADB_PASSWORD: kaima
    ports:
      - "3308:3306"
    volumes:
      - ./stores/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  docs-db:
    image: mongo:7
    container_name: docs-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: teo
      MONGO_INITDB_ROOT_PASSWORD: kaima
    ports:
      - "27017:27017"
    volumes:
      - ./stores/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "teo", "-p", "kaima", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      retries: 40

  cache:
    image: redis:7-alpine
    container_name: test-redis
    command: ["redis-server", "--requirepass", "kaima"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kaima", "--no-auth-warning", "ping"]
      interval: 2s
      retries: 30

  # Fills Redis once it's up (it has no init folder of its own), then exits
  cache-seed:
    image: redis:7-alpine
    container_name: test-redis-seed
    command: ["sh", "-c", "redis-cli -h cache -a kaima --no-auth-warning < /seed.redis"]
    volumes:
      - ./stores/redis/seed.redis:/seed.redis:ro
    depends_on:
      cache:
        condition: service_healthy
    restart: "no"

