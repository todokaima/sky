server.port=${PORT:29994}
# What "localhost" means in an api-docs URL typed on the page. In Docker: host.docker.internal (the host)
netcanvas.apidocs-host=${APIDOCS_HOST:localhost}
# Include the reason (e.g. "node Auth not found") in error responses
server.error.include-message=always

# ── NetCanvas settings ──
netcanvas.title=NetCanvas
# Node types shown as "+ Type" buttons: Name=#color, comma-separated. First one is the default.
netcanvas.types=Default=#38bdf8,Service=#a78bfa,Data=#34d399,External=#f59e0b
# How often the page refreshes from the API (ms), so changes made via curl show up
netcanvas.poll-ms=2000
# Layout physics: used to place new nodes and when you press "Re-layout"; nodes stay put otherwise
netcanvas.physics.charge=-500
netcanvas.physics.distance=200
netcanvas.physics.collide=110
# How many messages each link keeps; the bubble shows the latest
netcanvas.message-history=20
# Clicking a tab opens its details in a floating "island" instead of expanding it on the canvas.
# position: right | left | top | bottom | near (next to the tab). Islands can be dragged and resized afterwards.
netcanvas.island.position=right
netcanvas.island.width=340
netcanvas.island.height=420
# Dashed line from each tab to its island
netcanvas.island.leader-lines=true
